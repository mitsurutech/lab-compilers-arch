name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The lab is valid and inside the platform's limits
        run: |
          python3 - <<'PY'
          import glob, sys
          import yaml
          files = sorted(glob.glob('*.lab.yaml'))
          assert len(files) == 1, files
          for name in files:
              d = yaml.safe_load(open(name))
              for key in ('cpus', 'memory', 'disk', 'setup'):
                  assert key in d, f'{name}: no {key}'
              size = len(d['setup'].encode())
              assert size <= 16384, f'{name}: setup is {size} bytes, over 16 KB'
              print(name, 'ok')
          PY
